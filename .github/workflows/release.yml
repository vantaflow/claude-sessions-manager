name: Build & release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
          - os: macos-15-intel # Mac Intel : les Mac arm64 de GitHub sont souvent saturés (job jamais attribué) ; arm64 et x64 produits quand même
            target: --mac --arm64 --x64
    runs-on: ${{ matrix.os }}
    env:
      APPX_PUBLISHER: ${{ secrets.APPX_PUBLISHER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # téléchargement d'Electron raté en silence (réseau du runner) : nouvel essai, sinon échec net ici
      - name: Electron installé
        shell: bash
        run: |
          for i in 1 2 3; do
            node -e "require('fs').accessSync(require('electron'))" 2>/dev/null && exit 0
            echo "Electron absent, essai $i"; rm -rf node_modules/electron/dist node_modules/electron/path.txt
            node node_modules/electron/install.js || sleep 10
          done
          node -e "require('fs').accessSync(require('electron'))"
      - name: Vérifications
        run: |
          node --check server.js
          node --check electron/main.js
          node --check public/app.js
      - name: Tests de bout en bout du serveur (faux claude)
        run: npm test
      - name: Tests de l'application Electron (Playwright)
        run: npm run test:app
      # macOS : hdiutil refuse parfois d'éjecter l'image du .dmg (« Resource busy ») : nouvel essai
      - name: Empaquetage
        shell: bash
        run: |
          for i in 1 2 3; do
            npx electron-builder ${{ matrix.target }} --publish never && exit 0
            echo "Empaquetage raté, essai $i"; sleep 15
          done
          exit 1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Paquet Microsoft Store (si les identifiants Partner Center sont configurés)
        if: matrix.os == 'windows-latest' && env.APPX_PUBLISHER != ''
        env:
          APPX_IDENTITY_NAME: ${{ secrets.APPX_IDENTITY_NAME }}
          APPX_PUBLISHER: ${{ secrets.APPX_PUBLISHER }}
          APPX_PUBLISHER_DISPLAY_NAME: ${{ secrets.APPX_PUBLISHER_DISPLAY_NAME }}
        run: |
          node scripts/store-identity.js
          npx electron-builder --win appx --publish never
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest' && env.APPX_PUBLISHER != ''
        with:
          name: store-package
          path: dist/*.appx
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/sign-update.js
            electron/update-key.js
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*   # installeurs seulement (le paquet Store part vers Partner Center, pas dans la release)
          merge-multiple: true
      # signature des empreintes (latest*.yml) : l'app n'installe que ce qui est signé avec la clé du projet
      - name: Signature de la mise à jour
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: node scripts/sign-update.js dist/latest*.yml
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
