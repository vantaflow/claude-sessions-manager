name: Build & release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
          - os: macos-15-intel # Mac Intel : les Mac arm64 de GitHub sont souvent saturés (job jamais attribué) ; arm64 et x64 produits quand même
            target: --mac --arm64 --x64
    runs-on: ${{ matrix.os }}
    env:
      APPX_PUBLISHER: ${{ secrets.APPX_PUBLISHER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # téléchargement d'Electron raté en silence (réseau du runner) : nouvel essai, sinon échec net ici
      - name: Electron installé
        shell: bash
        run: |
          for i in 1 2 3; do
            node -e "require('fs').accessSync(require('electron'))" 2>/dev/null && exit 0
            echo "Electron absent, essai $i"; rm -rf node_modules/electron/dist node_modules/electron/path.txt
            node node_modules/electron/install.js || sleep 10
          done
          node -e "require('fs').accessSync(require('electron'))"
      - name: Vérifications
        run: |
          node --check server.js
          node --check electron/main.js
          node --check public/app.js
      - name: Tests de bout en bout du serveur (faux claude)
        run: npm test
      - name: Tests de l'application Electron (Playwright)
        run: npm run test:app
      # macOS : hdiutil refuse parfois d'éjecter l'image du .dmg (« Resource busy ») : nouvel essai
      - name: Empaquetage
        shell: bash
        run: |
          for i in 1 2 3; do
            npx electron-builder ${{ matrix.target }} --publish never && exit 0
            echo "Empaquetage raté, essai $i"; sleep 15
          done
          exit 1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Paquet Microsoft Store (si les identifiants Partner Center sont configurés)
        if: matrix.os == 'windows-latest' && env.APPX_PUBLISHER != ''
        env:
          APPX_IDENTITY_NAME: ${{ secrets.APPX_IDENTITY_NAME }}
          APPX_PUBLISHER: ${{ secrets.APPX_PUBLISHER }}
          APPX_PUBLISHER_DISPLAY_NAME: ${{ secrets.APPX_PUBLISHER_DISPLAY_NAME }}
        run: |
          node scripts/store-identity.js
          npx electron-builder --win appx --publish never
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest' && env.APPX_PUBLISHER != ''
        with:
          name: store-package
          path: dist/*.appx
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  # App native Windows (aperçu, native/windows) : même version, même serveur. Autotest contre un serveur de test
  # (faux claude) avant l'empaquetage. Un échec ici ne bloque jamais la publication de l'app Electron.
  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # serveur embarqué : node.exe + code du serveur de cette version (rien à installer, pas besoin de l'app Electron)
      - name: Serveur embarqué
        shell: pwsh
        run: pwsh native/windows/pack-server.ps1 -Out out/server.zip
      - name: Compilation
        working-directory: native/windows/CsmNative
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}' -replace '^v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+$') { $v = '0.0.0' }
          # un seul exécutable compressé (~115 Mo : runtime .NET, serveur CSM et Node compris ; rien à installer)
          dotnet publish -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:Version=$v -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o ../../../out/native
      - name: Autotest (serveur de test, faux claude)
        shell: pwsh
        run: |
          $t = "$env:RUNNER_TEMP\csm-native-st"; New-Item -ItemType Directory -Force "$t\data","$t\home" | Out-Null
          # sans CSM_SERVER_JS : l'app démarre son serveur embarqué (c'est lui qui est vérifié)
          $env:CSM_PORT = '17990'; $env:CSM_DATA = "$t\data"
          $env:CSM_CLAUDE = (Get-Command node).Source; $env:CSM_CLAUDE_ARGS = "`"$pwd\test\fake-claude.js`""
          $env:CSM_SECRETS_FILE_ONLY = '1'; $env:CSM_NO_RTK = '1'; $env:CSM_NO_PLUGIN_INSTALL = '1'; $env:CSM_DEFAULT_SYNC_SERVER = 'http://127.0.0.1:9'
          $env:USERPROFILE = "$t\home"; $env:HOME = "$t\home"; $env:CSM_SELFTEST_LOG = "$t\selftest.log"
          $p = Start-Process out\native\CSM.exe -ArgumentList '--selftest' -PassThru
          $p.WaitForExit(120000) | Out-Null
          Get-Content "$t\selftest.log"
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match '--port=17990' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          if (-not $p.HasExited -or $p.ExitCode -ne 0) { exit 1 }
      - name: Exécutable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $name = "CSM-natif-Windows-x64-${{ github.ref_name }}.exe"
          Copy-Item out\native\CSM.exe "dist\$name"
          # manifeste de mise à jour (signé par le job release) : l'app native n'installe que cette empreinte
          $sha = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLower()
          @{ version = '${{ github.ref_name }}'.TrimStart('v'); file = $name; sha256 = $sha } | ConvertTo-Json -Compress | Set-Content -NoNewline -Encoding utf8NoBOM dist\latest-native-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist-native-windows
          path: |
            dist/CSM-natif-*.exe
            dist/latest-native-windows.json
          if-no-files-found: error

  release:
    needs: [build, native-windows]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/sign-update.js
            electron/update-key.js
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*   # installeurs seulement (le paquet Store part vers Partner Center, pas dans la release)
          merge-multiple: true
      # signature des empreintes (latest*.yml) : l'app n'installe que ce qui est signé avec la clé du projet
      - name: Signature de la mise à jour
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: node scripts/sign-update.js dist/latest*.yml $(ls dist/latest-native-*.json 2>/dev/null)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
